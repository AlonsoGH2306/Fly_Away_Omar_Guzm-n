# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL (variables del entorno; usa los defaults definidos en docker-compose.yml / .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/flyaway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Secret (min. 32 bytes para HS256) y expiración en ms
jwt.secret=${JWT_SECRET:mi_secreto_super_seguro_para_fly_away_travel_2026}
jwt.expiration=${JWT_EXPIRATION:3600000}